<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 749 368" role="img" aria-label="ONE FM 98.5  Live and Local">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0C75E"/>
      <stop offset="45%" stop-color="#D4A84B"/>
      <stop offset="100%" stop-color="#A67C2E"/>
    </linearGradient>
    <linearGradient id="micBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8ECF0"/>
      <stop offset="100%" stop-color="#9AA3AD"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Broadcast arcs  gold prestige layer -->
  <g fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round" opacity="0.95">
    <path d="M598 42c28 18 42 40 42 66"/>
    <path d="M612 32c38 24 58 54 58 88"/>
    <path d="M626 22c48 32 72 72 72 112"/>
  </g>

  <!-- Microphone -->
  <g transform="translate(520 8)">
    <ellipse cx="88" cy="118" rx="52" ry="68" fill="url(#micBody)" stroke="#6B7280" stroke-width="2"/>
    <ellipse cx="88" cy="118" rx="34" ry="44" fill="#1B4F8F" opacity="0.35"/>
    <!-- grille lines -->
    <g stroke="#6B7280" stroke-width="1.2" opacity="0.6">
      <line x1="58" y1="98" x2="118" y2="98"/>
      <line x1="54" y1="108" x2="122" y2="108"/>
      <line x1="52" y1="118" x2="124" y2="118"/>
      <line x1="54" y1="128" x2="122" y2="128"/>
      <line x1="58" y1="138" x2="118" y2="138"/>
    </g>
    <!-- waveform in mic -->
    <path d="M72 118h8v-14h8v28h8v-18h8v10" stroke="#E31E24" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="72" y="178" width="32" height="28" rx="4" fill="#1B4F8F"/>
    <path d="M88 206v18" stroke="#F4F1EA" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="88" cy="232" rx="18" ry="6" fill="#1B4F8F"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-style="italic">
    <text x="8" y="148" font-size="118" fill="#FFFFFF" letter-spacing="-2">ONE</text>
    <text x="8" y="268" font-size="92" fill="#FFFFFF" letter-spacing="-1">FM</text>
    <text x="168" y="268" font-size="92" fill="#E31E24" letter-spacing="-1">98.5</text>
  </g>

  <!-- Cable / underline  gold -->
  <path d="M88 292c40 8 120 8 200 4 80-4 160-12 240-8 60 3 100 8 130 14" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
</svg>
