name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Netlify can see this site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::GitHub secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID are required. Site ID must be 8df4de74-d9a8-42ce-9316-61bd06475c94."
            exit 1
          fi
          code=$(curl -sS -o /tmp/netlify-site.json -w "%{http_code}" \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}")
          if [ "$code" != "200" ]; then
            echo "::error::Netlify HTTP ${code}: could not retrieve site. Replace GitHub secret NETLIFY_AUTH_TOKEN with a NEW personal access token (Netlify → User settings → Applications → New access token). Then re-run this workflow. Empty-commit retries will not fix this. Site ID must be 8df4de74-d9a8-42ce-9316-61bd06475c94."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Truth grep
        run: npm run truth

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STATION_NAME: ONE FM 98.5
          VITE_STATION_EMAIL: admin@fm985.com.au
          VITE_RADIO_CO_STATION_ID: sae3372059

      # nwtgck/actions-netlify@v3.0 cannot bundle functions on GitHub's Node 24
      # action runtime (spawn .../dist/esbuild ENOENT). Official CLI reads
      # netlify.toml (functions dir, redirects, headers) and deploys all three.
      - name: Deploy to Netlify
        run: npx --yes netlify-cli@23 deploy --prod --dir=dist --functions netlify/functions --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: Prove production is not the stale DEMO deploy
        run: node scripts/verify-live.mjs
