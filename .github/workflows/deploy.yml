name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STATION_NAME: ONE FM 98.5
          VITE_STATION_EMAIL: admin@fm985.com.au
          VITE_RADIO_CO_STATION_ID: sae3372059

      # nwtgck/actions-netlify@v3.0 was dropped 2026-07-28: its bundled esbuild
      # binary is missing under the current GitHub-hosted Node 24 runner
      # ("spawn .../dist/esbuild ENOENT"), which broke every deploy once
      # functions-dir was added. The official Netlify CLI is more robust and
      # reads netlify.toml (functions, redirects, headers) natively.
      - name: Deploy to Netlify
        run: npx --yes netlify-cli deploy --prod --no-build --dir=dist --auth="$NETLIFY_AUTH_TOKEN" --site="$NETLIFY_SITE_ID"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
