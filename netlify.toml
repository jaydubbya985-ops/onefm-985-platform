# ONE FM 98.5 — Netlify production config
# Site: onefmops (https://onefmops.netlify.app)
#
# Custom domain setup (Netlify Dashboard → Domain management):
#   1. Add domain: ops.fm985.com.au  (or fm985.com.au with /ops path via redirect)
#   2. Add DNS CNAME: ops → onefmops.netlify.app
#   3. Enable HTTPS (Netlify auto-provisions Let's Encrypt)
#   4. Optional: redirect onefmops.netlify.app → ops.fm985.com.au

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Site env (Netlify UI — never git): VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
  # Those keys are read at request time by /.netlify/functions/ops-config so
  # #/ops can go LIVE without a GitHub Actions rebuild. RESEND_API_KEY is
  # server-side only (send-invoice / send-enquiry).

[functions]
  directory = "netlify/functions"

# Proxy fm985.com.au WordPress API (avoids browser CORS on cross-origin fetch)
[[redirects]]
  from = "/api/fm985/*"
  to = "/.netlify/functions/fm985-proxy/:splat"
  status = 200
  force = true

# Legacy direct proxy fallback
[[redirects]]
  from = "/api/fm985-direct/*"
  to = "https://fm985.com.au/:splat"
  status = 200
  force = true

# HashRouter SPA — serve index.html for all routes (also handles direct /assets/ paths)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache hashed assets (Vite adds content hashes to filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers on all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

# HTML — short cache so deploys propagate quickly.
# NOTE: browsers request "/" (HashRouter never sends the #/ part), and a rule
# for "/index.html" does not match "/". Without an explicit Cache-Control on
# "/", browsers heuristically cache the app shell — then the next deploy
# renames the hashed chunks and returning visitors get stale pages or
# "Failed to fetch dynamically imported module". Cover both paths.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
