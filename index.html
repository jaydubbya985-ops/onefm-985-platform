<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="__ONEFM_META_DESCRIPTION__" />

    <!-- Open Graph — numbers injected from stationStats via Vite (formatOgDescription). Never hardcode 25 / 189,680 here. -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="ONE FM 98.5" />
    <meta property="og:title"       content="ONE FM 98.5 — Live and Local" />
    <meta property="og:description" content="__ONEFM_OG_DESCRIPTION__" />
    <meta property="og:image"       content="https://fm985.com.au/assets/images/studio-exterior-rainbow.jpg" />
    <meta property="og:url"         content="https://fm985.com.au/" />

    <!-- Twitter Card — no twitter:site. Confirmed profiles: Facebook + SoundCloud only (socialLinks.ts). -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="ONE FM 98.5" />
    <meta name="twitter:description" content="__ONEFM_OG_DESCRIPTION__" />
    <meta name="twitter:image"       content="https://fm985.com.au/assets/images/studio-exterior-rainbow.jpg" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/icon-192.png" />

    <title>ONE FM 98.5 — Live and Local</title>

    <!-- Fonts — preconnect first, then load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=optional" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=optional" rel="stylesheet" /></noscript>
    <!-- ON AIR poster type (Direction A) — swap, not optional: this font defines the design -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />

    <!-- LCP element — Home hero photo (HeroAtmosphere.tsx). Not discoverable until
         React mounts in this SPA, so preload it from static HTML. If the hero photo
         ever changes, update this href to match. -->
    <link rel="preload" as="image" href="/assets/images/event-lasers-crowd.jpg" fetchpriority="high" />

    <!-- Critical styles: prevent flash of unstyled background -->
    <style>html,body{background:#0A0A0A;color:#fff;margin:0}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
